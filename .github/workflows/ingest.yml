name: Data Ingestion

on:
  workflow_dispatch:
    inputs:
      max_chunks:
        description: 'Maximum chunks to ingest'
        required: false
        default: '1000'
        type: string
      target:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  ingest:
    name: Run Data Ingestion Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ingestion on EC2 (production)
        if: github.event.inputs.target == 'production'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          MAX_INGESTION_CHUNKS: ${{ github.event.inputs.max_chunks }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/ec2_key
          chmod 600 /tmp/ec2_key
          ssh -i /tmp/ec2_key -o StrictHostKeyChecking=accept-new ec2-user@$EC2_HOST \
            "bash -s" -- "$GHCR_TOKEN" "$MAX_INGESTION_CHUNKS" "${{ github.sha }}" <<'REMOTE'
            set -euo pipefail
            GHCR_TOKEN="$1"; MAX_INGESTION_CHUNKS="$2"; IMAGE_TAG="$3"
            cd /opt/legal-rag
            export IMAGE_TAG

            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            fi

            docker compose -f docker-compose.prod.yml pull ingestion cpp_router cpp_database
            MAX_INGESTION_CHUNKS="$MAX_INGESTION_CHUNKS" \
              docker compose -f docker-compose.prod.yml --profile ingest run --rm ingestion
          REMOTE

      - name: Run ingestion locally (staging)
        if: github.event.inputs.target == 'staging'
        env:
          MAX_INGESTION_CHUNKS: ${{ github.event.inputs.max_chunks }}
        run: |
          docker compose -f docker-compose.local.yml up -d
          MAX_INGESTION_CHUNKS="$MAX_INGESTION_CHUNKS" \
            docker compose -f docker-compose.local.yml --profile ingest run --rm ingestion
