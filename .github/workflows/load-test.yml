name: Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL for load testing'
        required: true
        default: 'https://nimish-legal-rag.duckdns.org'
        type: string
      scenario:
        description: 'Load test scenario'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - ramp_10k
          - spike_test
          - stress_test
          - soak_test
      vus:
        description: 'Max virtual users (for ramp scenarios)'
        required: false
        default: '100'
        type: string

env:
  K6_VERSION: "0.53.0"

jobs:
  smoke:
    name: k6 Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo apt-get update && sudo apt-get install -y bc
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run smoke
        env:
          BASE_URL: ${{ github.event.inputs.target_url }}
        run: |
          k6 run \
            -e BASE_URL=$BASE_URL \
            -e SCENARIO=smoke \
            -e MAX_VUS=5 \
            k6-load-test.js

  load-test:
    name: Run k6 Load Test
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo apt-get update && sudo apt-get install -y bc
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 Load Test
        env:
          BASE_URL: ${{ github.event.inputs.target_url }}
          SCENARIO: ${{ github.event.inputs.scenario }}
          MAX_VUS: ${{ github.event.inputs.vus }}
        run: |
          if [ "${SCENARIO}" = "smoke" ]; then
            k6 run \
              -e BASE_URL=$BASE_URL \
              -e SCENARIO=$SCENARIO \
              -e MAX_VUS=$MAX_VUS \
              k6-load-test.js
          else
            k6 run \
              -e BASE_URL=$BASE_URL \
              -e SCENARIO=$SCENARIO \
              -e MAX_VUS=$MAX_VUS \
              k6-load-test.js
          fi

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-results
          path: summary.json
          retention-days: 30

      - name: Parse Summary
        if: always()
        run: |
          if [ -f summary.json ]; then
            echo "## k6 Load Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Target:** ${{ github.event.inputs.target_url }}" >> $GITHUB_STEP_SUMMARY
            echo "**Scenario:** ${{ github.event.inputs.scenario }}" >> $GITHUB_STEP_SUMMARY
            echo "**Max VUs:** ${{ github.event.inputs.vus }}" >> $GITHUB_STEP_SUMMARY
          fi
