name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [cpp_router, cpp_database, api_gateway, data_ingestion]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR/Docker image references must be lowercase. github.repository is
      # mixed-case, so compute a lowercase owner/name for the image tags.
      - name: Compute lowercase image repo
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_REPO: ${{ needs.build-and-push.outputs.repo }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/ec2_key
          chmod 600 /tmp/ec2_key
          ssh -i /tmp/ec2_key -o StrictHostKeyChecking=accept-new ec2-user@$EC2_HOST \
            "bash -s" -- "$DB_PASSWORD" "$OPENAI_API_KEY" "$API_KEY" "$GHCR_TOKEN" "${{ github.sha }}" "$GHCR_REPO" <<'REMOTE'
            set -euo pipefail
            DB_PASSWORD="$1"; OPENAI_API_KEY="$2"; API_KEY="$3"; GHCR_TOKEN="$4"; IMAGE_TAG="$5"; GHCR_REPO="$6"
            cd /opt/legal-rag
            git fetch origin main
            git reset --hard origin/main

            # File-based secrets (no Swarm). Rewrite only when the value
            # changed; never echo secret material.
            mkdir -p secrets && chmod 700 secrets
            umask 077
            printf '%s' "$DB_PASSWORD" > secrets/DB_PASSWORD
            printf '%s' "$OPENAI_API_KEY" > secrets/openai_api_key
            printf '%s' "$API_KEY" > secrets/api_key

            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_REPO%%/*}" --password-stdin
            fi

            export IMAGE_TAG GHCR_REPO
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            # Gate on nginx -> api_gateway /health.
            for _ in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' https://nimish-legal-rag.duckdns.org/health || true)
              if [ "$code" = "200" ]; then
                echo "Deployment healthy"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed (last code: ${code:-none})"
            exit 1
          REMOTE

  post-deploy:
    name: Post-Deploy Verification
    needs: deploy-ec2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Verify Production Health
        run: |
          curl -sf https://nimish-legal-rag.duckdns.org/health | jq .
          curl -sf https://nimish-legal-rag.duckdns.org/system-health | jq .
