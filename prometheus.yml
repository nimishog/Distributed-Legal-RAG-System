global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'legal-rag-local'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cpp-router'
    static_configs:
      - targets: ['cpp_router:8080']
    metrics_path: '/metrics'

  - job_name: 'cpp-database-0'
    static_configs:
      - targets: ['cpp_database_0:8081']
    metrics_path: '/metrics'

  - job_name: 'cpp-database-1'
    static_configs:
      - targets: ['cpp_database_1:8081']
    metrics_path: '/metrics'

  - job_name: 'cpp-database-2'
    static_configs:
      - targets: ['cpp_database_2:8081']
    metrics_path: '/metrics'

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api_gateway:8000']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    metrics_path: '/metrics'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
    # Note: Requires node-exporter running on host
    # docker run -d --name node-exporter --net host --pid host -v /:/host:ro,rslave prom/node-exporter --path.rootfs=/host

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']
    # Note: Requires cAdvisor running on host
    # docker run -d --name cadvisor --volume=/:/rootfs:ro --volume=/var/run:/var/run:ro --volume=/sys:/sys:ro --volume=/var/lib/docker/:/var/lib/docker:ro --publish=8080:8080 --detach=true gcr.io/cadvisor/cadvisor:latest